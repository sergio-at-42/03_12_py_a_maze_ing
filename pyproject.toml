[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "Reusable maze generation and solving library (DFS-based)"
requires-python = ">=3.10"
authors = [
    { name = "sansaidi", email = "sana.saidi@learner.42.tech"},
    { name = "sbeldjao", email = "serge.beldjaoui@learner.42.tech"},
]

[tool.setuptools]
py-modules = ["mazegen"]